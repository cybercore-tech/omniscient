name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Run release gates
        # The Omarchy plugin gate needs a Wayland session, Quickshell and the
        # Omarchy shell; it runs locally (scripts/gate.sh full) before pushing.
        env:
          OMNISCIENT_SKIP_PLUGIN_GATE: "1"
        run: ./scripts/gate.sh release

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install audit tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: Static security gate
        run: bash scripts/security-gate.sh

      - name: RustSec audit
        run: cargo audit --deny warnings

      - name: Dependency policy
        run: cargo deny check advisories licenses bans sources
