[package]
name = "omniscient"
version = "0.1.0"
edition = "2021"
description = "CYBERDECK full system audit tool"
license = "MIT"
repository = "https://github.com/cybercore-tech/omniscient"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[lib]
name = "omniscient"
path = "src/lib.rs"

[[bin]]
name = "omniscient"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.103"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
crossterm = "=0.29.0"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
