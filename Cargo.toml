[package]
name = "omniscient"
version = "0.1.0"
edition = "2021"
description = "CYBERDECK full system audit tool"

[lib]
name = "omniscient"
path = "src/lib.rs"

[[bin]]
name = "omniscient"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.75"
chrono = { version = "=0.4.31", default-features = false, features = ["clock"] }
crossterm = "=0.27.0"
ratatui = "=0.26.3"
cybercore = { git = "https://github.com/darkstardevx/cybercore.git", tag = "v0.1.0" }
# Transitive pins to keep this buildable on an older cargo (this repo
# doesn't use these directly, but their newer releases require a
# cargo/edition version this toolchain doesn't have).
zeroize = "=1.7.0"
getrandom = "=0.2.15"
fastrand = "=2.0.2"
rustix = "=0.38.44"
